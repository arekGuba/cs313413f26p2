plugins {
    id 'com.github.sherter.google-java-format' version '0.9'
}

apply plugin: 'java'

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:all"
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.+') // added: makes all JUnit libraries use matching versions
    testImplementation 'org.junit.jupiter:junit-jupiter' // changed: removed ":5.+" because the line above now picks the version
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher' // added: the missing piece Gradle needs to start JUnit
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}
